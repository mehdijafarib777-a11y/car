<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
/* Layout: one phone-width column (max 560px, centred on larger screens); compact sticky header, fixed bottom tab bar with a raised "add" button; every section stacks in one column. */
:root{
  --bg:#f2f3f0; --surface:#ffffff; --surface-2:#e8eae5; --ink:#18201c; --muted:#58635d; --line:#d4d9d1;
  --accent:#33369c; --accent-ink:#ffffff; --accent-soft:#e6e6f6;
  --good:#1b7443; --good-soft:#e1f1e7; --warn:#9a5b00; --warn-soft:#fbefd9; --bad:#b0251d; --bad-soft:#fbe4e1;
  --v1:#2a78d6; --v2:#eb6834; --v3:#1baf7a; --v4:#eda100; --v5:#e87ba4; --v6:#008300; --v7:#6250d6; --v8:#e34948;
  --font:"Vazirmatn",Tahoma,"Segoe UI",system-ui,sans-serif;
  --r:14px; --col:560px; --navh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1a1f1c; --surface-2:#232a26; --ink:#e8ece9; --muted:#a2aca6; --line:#323a35;
  --accent:#aeadf3; --accent-ink:#17183f; --accent-soft:#272a4a;
  --good:#63c48f; --good-soft:#1c3226; --warn:#e2a84d; --warn-soft:#3a2d14; --bad:#f08b83; --bad-soft:#3c1d1a;
  --v1:#3987e5; --v2:#d95926; --v3:#199e70; --v4:#c98500; --v5:#d55181; --v6:#008300; --v7:#9085e9; --v8:#e66767;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1a1f1c; --surface-2:#232a26; --ink:#e8ece9; --muted:#a2aca6; --line:#323a35;
  --accent:#aeadf3; --accent-ink:#17183f; --accent-soft:#272a4a;
  --good:#63c48f; --good-soft:#1c3226; --warn:#e2a84d; --warn-soft:#3a2d14; --bad:#f08b83; --bad-soft:#3c1d1a;
  --v1:#3987e5; --v2:#d95926; --v3:#199e70; --v4:#c98500; --v5:#d55181; --v6:#008300; --v7:#9085e9; --v8:#e66767;
  color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:15px;line-height:1.65;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
#app{direction:rtl;min-height:100%;max-width:var(--col);margin:0 auto}
.num,.odo{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;line-height:1.35;text-wrap:balance}
h2{font-size:1.2rem;font-weight:800}
h3{font-size:1rem;font-weight:700}
a{color:var(--accent)}
.muted{color:var(--muted)}
small,.small{font-size:.82rem}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in,.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-size:1.08rem;font-weight:800;display:block;line-height:1.25}
.brand svg{flex:none}
.sync{font-size:.74rem;color:var(--muted);display:flex;align-items:center;gap:5px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--good)} .sync.off i{background:var(--bad)}
.top-actions{display:flex;gap:4px}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;color:var(--muted);text-decoration:none}
.icon-btn svg{width:22px;height:22px}
.icon-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}

/* bottom tab bar */
.bottom{position:fixed;z-index:6;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,var(--col));background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--navh);text-decoration:none;color:var(--muted);font-size:.7rem;font-weight:500}
.bottom a svg{width:23px;height:23px}
.bottom a[aria-current="page"]{color:var(--accent);font-weight:800}
.bottom a.fab span.ring{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);margin-top:-22px;border:4px solid var(--surface)}
.bottom a.fab svg{width:24px;height:24px}
.bottom a:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}

.wrap{padding-block:16px calc(var(--navh) + 28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.view-head{display:flex;flex-direction:column;gap:6px}
.view-head p{margin:0;color:var(--muted);font-size:.88rem}
.section{display:flex;flex-direction:column;gap:10px;min-width:0}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.foot{font-size:.74rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:2px}
.cols,.cols-2,.vgrid{display:flex;flex-direction:column;gap:14px;min-width:0}

/* vehicle switcher */
.vswitch{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.vswitch::-webkit-scrollbar{display:none}
.vswitch button{font:inherit;font-size:.88rem;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;min-height:40px;cursor:pointer}
.vswitch button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}

/* vehicle cards */
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.vcard.arch{border-style:dashed}
.vhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.vname{display:flex;align-items:center;gap:8px}
.dot{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block}
.vname h3{font-size:1.05rem}
.vmeta{font-size:.78rem;color:var(--muted)}
.plate-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.plate{--plate-bg:#ffffff;--plate-ink:#111111;--eu-blue:#1f4fbf;--eu-star:#ffd400;direction:ltr;display:inline-flex;align-items:stretch;background:var(--plate-bg);color:var(--plate-ink);border:2px solid var(--plate-ink);border-radius:7px;overflow:hidden;min-height:44px;max-width:100%}
.plate .band{background:var(--eu-blue);color:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:3px 5px;min-width:24px;font:700 .66rem/1 Arial,sans-serif}
.plate .band svg{width:16px;height:16px;margin-bottom:2px}
.plate .pn{display:flex;align-items:center;gap:7px;padding:0 13px;font:800 1.42rem/1 "Arial Narrow","Roboto Condensed",Arial,sans-serif;letter-spacing:.06em;white-space:nowrap}
.plate .seals{display:inline-flex;flex-direction:column;gap:2px}
.plate .seals i{width:11px;height:11px;border-radius:50%;display:block;border:1px solid #777777}
.plate .seals i:first-child{background:#4c8dd6}
.plate .seals i:last-child{background:#c8c8c8}
.plate.ir .band{background:none;padding:0;flex-direction:row;align-items:stretch}
.plate.ir .flag{display:flex;flex-direction:column;width:26px}
.plate.ir .flag span{flex:1}
.plate.ir .flag span:nth-child(1){background:#239f40}
.plate.ir .flag span:nth-child(2){background:#ffffff}
.plate.ir .flag span:nth-child(3){background:#da0000}
.plate.ir .pn{font-family:var(--font);letter-spacing:.02em;gap:10px}
.plate.ir .code{border-left:2px solid var(--plate-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 9px;font-family:var(--font);line-height:1.1}
.plate.ir .code small{font-size:.62rem;font-weight:700}
.plate.ir .code b{font-size:1.1rem}
.btn.big{min-height:52px;font-size:1rem;width:100%;border-radius:12px}
.btn.big svg{width:22px;height:22px}
.scrim{position:fixed;inset:0;background:rgba(8,12,10,.5);z-index:20}
.sheet{position:fixed;z-index:21;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,var(--col));max-height:92%;overflow:auto;background:var(--surface);color:var(--ink);border-radius:18px 18px 0 0;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 30px rgba(0,0,0,.2);direction:rtl}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 2px}
.sheet .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sum{background:var(--surface-2);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:.9rem}
.sum b{font-size:1.25rem;font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem}
@media (prefers-reduced-motion:no-preference){.sheet{animation:sheetup .22s ease-out}@keyframes sheetup{from{transform:translate(-50%,30px);opacity:.6}to{transform:translate(-50%,0);opacity:1}}}
.kpi-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kpi-line b{font-size:1.45rem;font-weight:800;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.legend div{display:flex;align-items:center;gap:8px}
.legend .val{margin-inline-start:auto;font-variant-numeric:tabular-nums;font-weight:700}
.seg button svg{width:16px;height:16px;vertical-align:-3px;margin-inline-end:4px}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
.seg.wrap{flex-wrap:wrap;overflow:visible}
.seg.wrap button{flex:1 1 30%}
.chkrow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.chkrow:last-child{border-bottom:0}
.chkrow .top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chkrow label.tog{display:flex;align-items:center;gap:8px;font-size:.92rem;font-weight:600}
.donebox{display:flex;flex-direction:column;gap:6px;background:var(--good-soft);border-radius:10px;padding:8px 10px}
.kmrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.kmrow .k{font-size:.76rem;color:var(--muted);display:block}
.kmrow .v{font-weight:800;font-size:1.15rem}
.kmrow .s{font-size:.72rem;color:var(--muted);display:block}
.inline-edit{display:flex;flex-direction:column;gap:8px;width:100%}
.inline-edit .bar{flex-wrap:nowrap}
.inline-edit input{flex:1}
.odo{display:inline-flex;direction:ltr;gap:3px;background:var(--ink);padding:5px;border-radius:8px}
.odo span{display:inline-block;min-width:1.45em;text-align:center;background:var(--surface);color:var(--ink);font-weight:800;font-size:1.45rem;line-height:1.45;border-radius:4px}
.odo span.lead{color:var(--muted);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.stat{display:flex;flex-direction:column;min-width:0}
.stat .k{font-size:.76rem;color:var(--muted)}
.stat .v{font-weight:800;font-size:1.05rem}
.stat .s{font-size:.72rem;color:var(--muted)}
.spark{width:100%;height:44px;display:block}

/* chips & pills */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;line-height:1.6;padding:0 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;vertical-align:middle}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.user{color:var(--ink);background:var(--surface-2);border-color:transparent}
.chip.user::before{background:var(--ink)}
.chip.ext{color:var(--accent);border-color:var(--accent)}
.chip.ext::before{background:transparent;border:1.5px solid currentColor;width:5px;height:5px}
.chip.approx,.chip.unconf{border-style:dashed;color:var(--warn);border-color:var(--warn)}
.chip.approx::before,.chip.unconf::before{background:transparent;border:1.5px dashed currentColor;width:5px;height:5px}
.chip.calc{color:var(--muted)}
.chip.calc::before{border-radius:1px;transform:rotate(45deg)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill svg{width:12px;height:12px}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .body{flex:1;min-width:0}
.li .t{font-weight:700}
.li .d{font-size:.82rem;color:var(--muted)}
.li .why{font-size:.78rem;color:var(--muted);margin-top:2px}
.li-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.timeline .li{position:relative;padding-inline-start:18px}
.timeline .li::before{content:"";position:absolute;inset-inline-start:4px;top:19px;width:8px;height:8px;border-radius:50%;background:var(--vc,var(--muted))}
.timeline .li::after{content:"";position:absolute;inset-inline-start:7.5px;top:29px;bottom:-11px;width:1px;background:var(--line)}
.timeline .li:last-child::after{display:none}
.empty{padding:18px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center;font-size:.9rem}

/* event rows (history, fills) */
.evlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ev{border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev-main{font:inherit;color:inherit;text-align:right;width:100%;background:none;border:0;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;cursor:pointer;min-height:56px}
.ev-main .dot{margin-top:7px}
.ev-body{flex:1;min-width:0}
.ev-t{font-weight:700;font-size:.92rem}
.ev-d{font-size:.78rem;color:var(--muted)}
.ev-s{font-size:.84rem;overflow-wrap:anywhere}
.ev-amt{text-align:left;font-weight:700;font-size:.88rem;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ev.open{background:var(--accent-soft)}
.ev-more{padding:0 14px 12px 14px;display:flex;flex-direction:column;gap:10px}
.detail{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}

/* controls */
.btn{font:inherit;font-size:.9rem;font-weight:700;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;min-height:42px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:active{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{font-size:.8rem;padding:4px 12px;min-height:34px}
.btn.block{width:100%}
.btn.link{border:0;background:none;color:var(--accent);padding:0 4px;min-height:34px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.ev-main:focus-visible,.vswitch button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:12px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{font:inherit;font-size:.86rem;border:0;background:none;color:var(--muted);padding:6px 12px;min-height:38px;border-radius:9px;cursor:pointer;font-weight:500;white-space:nowrap;flex:1 0 auto}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:800;box-shadow:0 0 0 1px var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.bar.end{justify-content:flex-start}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;color:var(--muted);font-weight:500}
.field .hint{font-size:.74rem;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:46px;min-width:0;width:100%}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
textarea{min-height:76px;resize:vertical}
input[type=number],input[type=date]{direction:ltr;text-align:right}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .wide{grid-column:1/-1}
@media (max-width:359px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;color:var(--ink);background:var(--surface-2);padding:6px 12px;border-radius:10px;min-height:40px}
.req{color:var(--bad)}
.savebar{position:sticky;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:8px;z-index:4}
.savebar .btn{flex:1;min-height:48px;box-shadow:0 4px 14px rgba(0,0,0,.12)}

.issues{border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:.88rem}
.issues.conflict{background:var(--warn-soft);border:1px solid var(--warn)}
.issues.error{background:var(--bad-soft);border:1px solid var(--bad)}
.issues.info{background:var(--surface-2)}
.issues ul{margin:0;padding-inline-start:18px}

/* charts */
.chart svg{display:block;width:100%;height:auto;direction:ltr;touch-action:pan-y}
.chart text{fill:var(--muted);font-family:var(--font);font-size:10px}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--muted);stroke-width:1}
.chart-cap{font-size:.76rem;color:var(--muted)}
.chart-read{font-size:.82rem;min-height:1.4em;color:var(--ink)}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:.86rem}
.hbar .track{grid-column:1/-1;height:10px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hbar .fill{height:100%;background:var(--accent);border-radius:4px 0 0 4px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k{font-size:.74rem;color:var(--muted)}
.kpi .v{font-size:1.12rem;font-weight:800;overflow-wrap:anywhere}
.kpi .s{font-size:.7rem;color:var(--muted)}

.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.84rem}
.rcard dt{color:var(--muted)}
.rcard dd{margin:0;min-width:0;overflow-wrap:anywhere}
.figs{margin:0;padding-inline-start:18px;font-size:.86rem}

.tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;padding:6px 9px;border-radius:8px;max-width:240px;direction:rtl;line-height:1.5}
.toast{position:fixed;z-index:40;bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:.88rem;max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}
.notice{background:var(--surface-2);border-radius:var(--r);padding:12px 14px;font-size:.88rem}
@media (prefers-reduced-motion:no-preference){.btn,.seg button,.ev-main{transition:background .15s}}
</style>

<script>
"use strict";
/* ---------- constants ---------- */
const TYPES={fuel:'سوخت‌گیری',service:'سرویس',repair:'تعمیر',accident:'تصادف',expense:'هزینه',document:'مدرک',odometer:'ثبت کیلومتر'};
const CUR={TRY:'لیر',USD:'دلار',EUR:'یورو',IRR:'ریال'};
const FUELS=['بنزین','دیزل','LPG','هیبرید','برقی'];
const DOCTYPES=['بیمه ترافیک (Trafik)','بیمه کاسکو (Kasko)','معاینه فنی (TÜVTÜRK)','کارت خودرو (Ruhsat)','گواهینامه راننده','سایر'];
const COUNTRIES={
 TR:{name:'ترکیه',cur:'TRY',fmt:'34 ABC 123',re:/^(0[1-9]|[1-7]\d|8[01])\s?[A-Z]{1,3}\s?\d{2,4}$/,cold:1,hot:1},
 DE:{name:'آلمان',cur:'EUR',fmt:'B AB 1234',re:/^[A-ZÄÖÜ]{1,3}[\s-]?[A-Z]{1,2}\s?\d{1,4}[EH]?$/,cold:1,hot:0},
 IR:{name:'ایران',cur:'IRR',fmt:'12 ب 345 - 67',re:/^\d{2}\s?[\u0600-\u06FF]\s?\d{3}\s?-?\s?\d{2}$/,cold:1,hot:1},
 XX:{name:'سایر',cur:null,fmt:'',re:/.+/,cold:0,hot:0}};
const SEASONAL=[{id:'antifreeze',name:'بررسی ضدیخ رادیاتور',cold:1},{id:'wintertyre',name:'لاستیک زمستانی',cold:1},{id:'battery',name:'تست باتری پیش از سرما',cold:1},{id:'washer',name:'مایع شیشه‌شوی ضدیخ',cold:1},{id:'ac',name:'سرویس کولر پیش از تابستان',hot:1},{id:'cooling',name:'بررسی سیستم خنک‌کننده موتور',hot:1}];
const LANGS={fa:'فارسی',en:'English',tr:'Türkçe'};
const ROUTES=['dashboard','add','history','reports','service','research','prefs'];
const STATE_UI={overdue:['bad','سررسید گذشته'],soon:['warn','نزدیک'],ok:['good','در موعد'],missing:['neutral','بدون سابقه']};
const ICON={bad:'<svg viewBox="0 0 12 12"><path d="M6 1 11 10H1z" fill="currentColor"/></svg>',warn:'<svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 3v3.5" stroke="currentColor" stroke-width="2"/></svg>',good:'<svg viewBox="0 0 12 12"><path d="M2 6.5 5 9l5-6" fill="none" stroke="currentColor" stroke-width="2"/></svg>',neutral:'<svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2 1.6"/></svg>'};

const S={db:null,assets:null,downloads:null,vehicles:{},events:{},rules:{},research:{},settings:null,
  loaded:{vehicles:false,events:false,rules:false,research:false,settings:false},
  route:'dashboard',editing:false,pending:false,
  dashArch:false,dashVeh:'all',
  form:{type:'fuel',editId:null,confirm:false,issues:null},
  hist:{q:'',veh:'all',type:'all',from:'',to:'',sort:'date',dir:'desc',open:null,delAsk:null,showF:false},
  rep:{veh:null,range:'all',from:'',to:'',metric:'dist',ctype:'curve',sel:null},
  fs:null,svcVeh:null,plateWarn:null,
  ruleEdit:null,addRule:false,vehEdit:null};

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa=(n,d=0)=>(n==null||Number.isNaN(+n))?'—':Number(n).toLocaleString('fa-IR',{maximumFractionDigits:d});
const parseD=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const iso=dt=>dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
const todayISO=()=>iso(new Date());
const cal=()=>(S.settings&&S.settings.calendar==='persian')?'persian':'gregory';
const _fm={};function fmtr(loc,opt){const k=loc+JSON.stringify(opt);return _fm[k]||(_fm[k]=new Intl.DateTimeFormat(loc,opt))}
function fmtDate(s,opt){if(!s)return '—';try{return fmtr('fa-IR-u-ca-'+cal(),opt||{year:'numeric',month:'short',day:'numeric'}).format(parseD(s))}catch(e){return s}}
function fmtStamp(s){if(!s)return '—';try{return fmtr('fa-IR-u-ca-'+cal(),{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(s))}catch(e){return s}}
const curDefault=()=>(S.settings&&S.settings.currency)||'TRY';
const country=()=>(S.settings&&COUNTRIES[S.settings.country])?S.settings.country:'TR';
const plateCountry=v=>(v&&COUNTRIES[v.plateCountry])?v.plateCountry:country();
const faD=x=>String(x).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const enD=x=>String(x).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const money=(n,c,d=0)=>n==null?'—':fa(n,d)+' '+(CUR[c]||c||'');
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
function addMonths(s,m){const d=parseD(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+m);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)}
function calParts(s){const p=fmtr('en-US-u-ca-'+cal()+'-nu-latn',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(parseD(s));const g=t=>+String((p.find(x=>x.type===t)||{}).value||'').replace(/\D/g,'');return {y:g('year'),m:g('month'),d:g('day')}}
function startOfYear(){const t=new Date();if(cal()==='gregory')return t.getFullYear()+'-01-01';const d=new Date(t);for(let i=0;i<370;i++){const p=calParts(iso(d));if(p.m===1&&p.d===1)return iso(d);d.setDate(d.getDate()-1)}return iso(t)}
function startOfMonth(){const t=new Date();if(cal()==='gregory')return iso(new Date(t.getFullYear(),t.getMonth(),1));const d=new Date(t);for(let i=0;i<32;i++){if(calParts(iso(d)).d===1)return iso(d);d.setDate(d.getDate()-1)}return iso(t)}
const uid=p=>p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o||{}));
function pill(state,txt){const [k,label]=STATE_UI[state]||['neutral',state];return `<span class="pill ${k}">${ICON[k]}${esc(txt||label)}</span>`}
function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className='toast'+(kind?' '+kind:'');t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}

/* ---------- data access ---------- */
const V=()=>Object.values(S.vehicles).sort((a,b)=>(a.slot||9)-(b.slot||9));
const activeV=()=>V().filter(v=>v.status!=='archived');
const evs=vid=>Object.values(S.events).filter(e=>!vid||vid==='all'||e.vehicleId===vid);
const sortEv=(a,b)=>a.date<b.date?-1:a.date>b.date?1:((a.km??-1)-(b.km??-1));
const vname=v=>v?(v.short||((v.brand||'')+' '+(v.model||'')).trim()):'—';
const vcol=v=>'var(--v'+((v&&v.slot)||1)+')';
const vById=id=>S.vehicles[id];
function odo(vid){let b=null;for(const e of evs(vid))if(e.km!=null&&(!b||e.km>b.km))b=e;return b}
function amt(e){switch(e.type){
  case 'fuel':return e.total!=null?e.total:(e.liters!=null&&e.ppl!=null?e.liters*e.ppl:null);
  case 'service':case 'repair':return (e.labor==null&&e.partsCost==null)?null:(+e.labor||0)+(+e.partsCost||0);
  case 'accident':case 'document':return e.cost??null;
  case 'expense':return e.amount??null;default:return null}}
function cat(e){return e.type==='expense'?(e.category||'سایر'):e.type==='document'?(e.docType||'مدرک'):TYPES[e.type]}
function sumCur(list){const o={};for(const e of list){const a=amt(e);if(a==null)continue;const c=e.currency||curDefault();o[c]=(o[c]||0)+a}return o}
function moneyMulti(o){const k=Object.keys(o);return k.length?k.map(c=>money(o[c],c)).join(' + '):'—'}
const mainCur=o=>{const k=Object.keys(o);return k.length===1?k[0]:null};

function fuelSeries(vid){
  const fills=evs(vid).filter(e=>e.type==='fuel').sort(sortEv);
  let lastKm=null,acc=0;const segs=[];
  for(const f of fills){
    if(f.km==null||!(f.liters>0)||(f.fullTank!==true&&f.fullTank!==false)){lastKm=null;acc=0;continue}
    if(f.fullTank===false){if(lastKm!=null)acc+=f.liters;continue}
    if(lastKm!=null&&f.km>lastKm){const dist=f.km-lastKm;segs.push({id:f.id,date:f.date,km:f.km,dist,liters:acc+f.liters,cons:(acc+f.liters)/dist*100})}
    lastKm=f.km;acc=0}
  return {fills,segs}}
function consStats(segs){if(!segs.length)return null;const L=segs.reduce((s,x)=>s+x.liters,0),D=segs.reduce((s,x)=>s+x.dist,0);return {avg:L/D*100,n:segs.length,L,D,last:segs[segs.length-1]}}

/* reminders */
function ruleStatus(r){
  const cur=odo(r.vehicleId);
  const hist=evs(r.vehicleId).filter(e=>(e.type==='service'||e.type==='repair')&&(e.kinds||[]).includes(r.matchKind)).sort(sortEv);
  const last=hist[hist.length-1];
  if(!last)return {state:'missing',reason:`هیچ «${r.matchKind}» برای این خودرو ثبت نشده است. برای شروع یادآوری، آخرین انجام آن را در «ثبت رویداد» وارد کنید.`};
  const dueDate=(r.dueOverride&&r.dueOverride.after===last.id&&r.dueOverride.date)?r.dueOverride.date:(r.intervalMonths?addMonths(last.date,+r.intervalMonths):null);
  const dueKm=(r.intervalKm&&last.km!=null)?last.km+ +r.intervalKm:null;
  const t=todayISO();const dLeft=dueDate?daysBetween(t,dueDate):null;const kLeft=(dueKm!=null&&cur)?dueKm-cur.km:null;
  let state='ok';
  if((dLeft!=null&&dLeft<0)||(kLeft!=null&&kLeft<=0))state='overdue';
  else if((r.warnDays!=null&&dLeft!=null&&dLeft<=r.warnDays)||(r.warnKm!=null&&kLeft!=null&&kLeft<=r.warnKm))state='soon';
  const approx=(last.approx||[]).includes('km');
  const iv=[r.intervalMonths?fa(r.intervalMonths)+' ماه':null,r.intervalKm?fa(r.intervalKm)+' کیلومتر':null].filter(Boolean).join(' یا ');
  let reason=`بر اساس «${r.matchKind}» ثبت‌شده در ${fmtDate(last.date)}${last.km!=null?' در '+fa(last.km)+' کیلومتر'+(approx?' (تقریبی)':''):''} و فاصله ${iv}${r.intervalMonths&&r.intervalKm?'، هر کدام زودتر':''} که شما تأیید کرده‌اید.`;
  const parts=[];if(dueDate)parts.push(`موعد تاریخی: ${fmtDate(dueDate)} (${dLeft<0?fa(-dLeft)+' روز گذشته':fa(dLeft)+' روز مانده'})`);
  if(dueKm!=null)parts.push(`موعد کیلومتری: ${fa(dueKm)} (${kLeft==null?'کیلومتر فعلی ثبت نشده':kLeft<=0?fa(-kLeft)+' کیلومتر گذشته':fa(kLeft)+' کیلومتر مانده'})`);
  return {state,last,dueDate,dueKm,dLeft,kLeft,noWarn:r.warnDays==null&&r.warnKm==null,reason,parts}}

function niceTicks(min,max,n){if(min===max){min-=1;max+=1}const s0=(max-min)/(n||4),mag=Math.pow(10,Math.floor(Math.log10(s0))),e=s0/mag,step=(e>=7.5?10:e>=3.5?5:e>=1.5?2:1)*mag;const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step,t=[];for(let v=lo;v<=hi+step/2;v+=step)t.push(+v.toFixed(8));return t}
function timeTicks(t0,t1,n){const out=[];const span=t1-t0||1;for(let i=0;i<=n;i++)out.push(t0+span*i/n);return out}
function lineChart(o){
  const W=360,H=210,L=34,R=8,T=14,B=26;const pts=o.pts;if(pts.length<2)return `<div class="empty">${esc(o.empty||'برای رسم نمودار دست‌کم دو نقطه داده لازم است.')}</div>`;

  const t0=Math.min(...xs),t1=Math.max(...xs);const yt=niceTicks(Math.min(...ys,o.floor??Infinity),Math.max(...ys),4);const y0=yt[0],y1=yt[yt.length-1];

  for(const v of yt)s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fa(v,o.yd||0)}</text>`;
  s+='</g>';

  return s+'</svg>'}
function barChart(o){

  const maxV=Math.max(...bars.map(b=>b.parts.reduce((s,p)=>s+p.v,0)),0);const yt=niceTicks(0,maxV||1,4);const y1=yt[yt.length-1];

    b.parts.forEach((p,j)=>{if(!p.v)return;const y=Y(base+p.v),h=Y(base)-y;const top=j===b.parts.length-1||!b.parts.slice(j+1).some(q=>q.v);

const CT_ICON={curve:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12C4 12 5 5 8 6s4 5 7-2"/></svg>',bar:'<svg viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="7" width="3" height="7" rx="1"/><rect x="6.5" y="3" width="3" height="11" rx="1"/><rect x="11" y="9" width="3" height="5" rx="1"/></svg>',pie:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="3"><circle cx="8" cy="8" r="5.5" stroke-dasharray="22 13"/></svg>'};
function niceMax(v){if(v<=0)return 1;const m=Math.pow(10,Math.floor(Math.log10(v))),e=v/m;return (e<=1?1:e<=2?2:e<=2.5?2.5:e<=5?5:10)*m}
function smoothPath(P){if(P.length<2)return '';const n=P.length,dx=[],dy=[],sl=[],mm=[];for(let i=0;i<n-1;i++){dx[i]=P[i+1][0]-P[i][0];dy[i]=P[i+1][1]-P[i][1];sl[i]=dx[i]?dy[i]/dx[i]:0}
  mm[0]=sl[0];mm[n-1]=sl[n-2];for(let i=1;i<n-1;i++)mm[i]=sl[i-1]*sl[i]<=0?0:(sl[i-1]+sl[i])/2;
  for(let i=0;i<n-1;i++){if(sl[i]===0){mm[i]=mm[i+1]=0;continue}const a=mm[i]/sl[i],b=mm[i+1]/sl[i],h=a*a+b*b;if(h>9){const k=3/Math.sqrt(h);mm[i]=k*a*sl[i];mm[i+1]=k*b*sl[i]}}
  let d=`M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;for(let i=0;i<n-1;i++){const h=dx[i]/3;d+=`C${(P[i][0]+h).toFixed(1)},${(P[i][1]+mm[i]*h).toFixed(1)} ${(P[i+1][0]-h).toFixed(1)},${(P[i+1][1]-mm[i+1]*h).toFixed(1)} ${P[i+1][0].toFixed(1)},${P[i+1][1].toFixed(1)}`}return d}
function xyChart(pts,type,color,fmtV){
  const W=360,H=210,L=40,Rr=12,Tp=16,B=26;if(!pts.length)return '<div class="empty">داده‌ای برای این بازه نیست.</div>';
  const max=niceMax(Math.max(...pts.map(p=>p.v))*1.08);const n=pts.length,sel=S.rep.sel;
  const X=i=>type==='bar'?L+(i+.5)*(W-L-Rr)/n:L+(n===1?(W-L-Rr)/2:i*(W-L-Rr)/(n-1)),Y=v=>Tp+(1-v/max)*(H-Tp-B);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img"><g class="grid">`;for(let k=0;k<=4;k++){const v=max*k/4;s+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+3.5}" text-anchor="end">${fa(v,max<20?1:0)}</text>`}s+='</g>';
  const every=Math.ceil(n/5);pts.forEach((p,i)=>{if(i%every===0||i===n-1)s+=`<text x="${X(i)}" y="${H-8}" text-anchor="${type==='bar'?'middle':i===0?'start':i===n-1?'end':'middle'}">${esc(p.lab)}</text>`});
  if(type==='bar'){const bw=Math.max(3,(W-L-Rr)/n*.62);pts.forEach((p,i)=>{const y=Y(p.v),h=Y(0)-y,x=X(i)-bw/2,r=Math.min(4,bw/2,h);
      if(h>0)s+=`<path d="M${x.toFixed(1)},${Y(0)}V${(y+r).toFixed(1)}Q${x.toFixed(1)},${y.toFixed(1)} ${(x+r).toFixed(1)},${y.toFixed(1)}H${(x+bw-r).toFixed(1)}Q${(x+bw).toFixed(1)},${y.toFixed(1)} ${(x+bw).toFixed(1)},${(y+r).toFixed(1)}V${Y(0)}Z" fill="${color}" opacity="${sel==null||sel===i?1:.45}"/>`;
      s+=`<rect x="${(X(i)-(W-L-Rr)/n/2).toFixed(1)}" y="${Tp}" width="${((W-L-Rr)/n).toFixed(1)}" height="${H-Tp-B}" fill="transparent" data-ci="${i}" style="cursor:pointer"/>`});
    const mi=pts.reduce((m,p,i)=>p.v>pts[m].v?i:m,0);s+=`<text x="${X(mi)}" y="${Y(pts[mi].v)-5}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${fmtV(pts[mi].v)}</text>`}
  else{const P=pts.map((p,i)=>[X(i),Y(p.v)]);const d=smoothPath(P)||`M${P[0][0]},${P[0][1]}`;
    if(n>1)s+=`<path d="${d}L${P[n-1][0]},${Y(0)}L${P[0][0]},${Y(0)}Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round"/>`;
    P.forEach((q,i)=>{const big=i===n-1||sel===i;s+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${big?4.5:2.6}" fill="${color}" stroke="var(--surface)" stroke-width="${big?2:1}"/><circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="13" fill="transparent" data-ci="${i}" style="cursor:pointer"/>`});
    s+=`<text x="${P[n-1][0].toFixed(1)}" y="${(P[n-1][1]-9).toFixed(1)}" text-anchor="end" style="fill:var(--ink);font-weight:700">${fmtV(pts[n-1].v)}</text>`}
  return s+'</svg>'}
function donut(parts,unit,fmtV){
  const tot=parts.reduce((s,p)=>s+p.v,0);if(!tot)return '<div class="empty">داده‌ای برای این بازه نیست.</div>';
  const R1=70,r1=46,cx=90,cy=90;let a=-Math.PI/2;let s=`<svg viewBox="0 0 180 180" style="max-width:220px;margin:0 auto;direction:ltr" role="img">`;
  parts.forEach((p,i)=>{const da=p.v/tot*2*Math.PI;const gap=parts.length>1?.03:0;const a0=a+gap/2,a1=a+da-gap/2;a+=da;if(a1<=a0)return;const lg=a1-a0>Math.PI?1:0;const P=(rad,ang)=>[cx+rad*Math.cos(ang),cy+rad*Math.sin(ang)];

    const [x0,y0]=P(R1,a0),[x1,y1]=P(R1,a1),[x2,y2]=P(r1,a1),[x3,y3]=P(r1,a0);
    s+=`<path d="M${x0.toFixed(2)},${y0.toFixed(2)}A${R1},${R1} 0 ${lg} 1 ${x1.toFixed(2)},${y1.toFixed(2)}L${x2.toFixed(2)},${y2.toFixed(2)}A${r1},${r1} 0 ${lg} 0 ${x3.toFixed(2)},${y3.toFixed(2)}Z" fill="${p.color}" opacity="${S.rep.sel==null||S.rep.sel===i?1:.45}" data-ci="${i}" style="cursor:pointer"/>`});
  s+=`<text x="${cx}" y="${cy-2}" text-anchor="middle" style="fill:var(--ink);font-size:16px;font-weight:800">${fmtV(tot)}</text><text x="${cx}" y="${cy+16}" text-anchor="middle">${esc(unit)}</text></svg>`;
  return s+`<div class="legend">${parts.map(p=>`<div><span class="dot" style="background:${p.color}"></span>${esc(p.name)}<span class="val">${fmtV(p.v)} · ${fa(p.v/tot*100,0)}٪</span></div>`).join('')}</div>`}
function hbarList(parts,fmtV){const mx=Math.max(...parts.map(p=>p.v),1);return parts.length?`<div class="hbars">${parts.map(p=>`<div class="hbar"><span><span class="dot" style="background:${p.color}"></span> ${esc(p.name)}</span><span class="num">${fmtV(p.v)}</span><div class="track"><div class="fill" style="width:${(p.v/mx*100).toFixed(1)}%;background:${p.color}"></div></div></div>`).join('')}</div>`:'<div class="empty">داده‌ای برای این بازه نیست.</div>'}
function distSpread(vid,B){const r=evs(vid).filter(e=>e.km!=null).sort(sortEv);const acc={};
  for(let i=1;i<r.length;i++){const a=r[i-1],b=r[i];const n=daysBetween(a.date,b.date),km=b.km-a.km;if(n<=0||km<=0)continue;const d=parseD(a.date);

function validate(e,id){
  const err=[],con=[],info=[];const t=todayISO();
  if(!e.vehicleId)err.push('خودرو را انتخاب کنید.');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(e.date||''))err.push('تاریخ را وارد کنید.');
  const v=vById(e.vehicleId);if(v&&v.status==='archived'&&!id)err.push('این خودرو بایگانی شده و ثبت جدید ندارد.');
  for(const f of F.filter(f=>f.types.includes(e.type)&&(f.req||[]).includes(e.type))){const x=e[f.k];if(x==null||x===''||(Array.isArray(x)&&!x.length))err.push(`«${f.label}» لازم است.`)}
  if(e.type==='odometer'&&e.km==null)err.push('کیلومتر را وارد کنید.');
  if(e.type==='fuel'){if(e.liters!=null&&e.liters<=0)err.push('مقدار سوخت باید بیشتر از صفر باشد.');if(e.total==null)info.push('مبلغ وارد نشده؛ این سوخت‌گیری در هزینه‌ها حساب نمی‌شود.');if(e.km==null)info.push('کیلومتر وارد نشده؛ مصرف این دوره محاسبه نمی‌شود.')}
  if(e.km!=null&&e.km<0)err.push('کیلومتر نمی‌تواند منفی باشد.');
  if(e.date&&e.date>t)con.push(`تاریخ ${fmtDate(e.date)} در آینده است.`);
  if(e.type==='document'&&e.start&&e.expiry&&e.expiry<e.start)err.push('تاریخ انقضا پیش از تاریخ شروع است.');
  if(e.km!=null&&e.vehicleId&&e.date){
    const others=evs(e.vehicleId).filter(x=>x.id!==id&&x.km!=null);
    const before=others.filter(x=>x.date<=e.date).sort((a,b)=>b.km-a.km)[0];
    if(before&&e.km<before.km)con.push(`کیلومتر ${fa(e.km)} کمتر از ثبت قبلی است: ${fa(before.km)} در ${fmtDate(before.date)} (${TYPES[before.type]}).`);
    const after=others.filter(x=>x.date>e.date&&x.km<e.km).sort((a,b)=>a.km-b.km)[0];
    if(after)con.push(`ثبت بعدی در ${fmtDate(after.date)} کیلومتر ${fa(after.km)} دارد که کمتر از مقدار جدید است.`)}
  return {err,con,info}}

async function saveEvent(force){

  const btn=$('#ev-save');if(btn)btn.disabled=true;
  const base=id?clone(S.events[id]):{source:'user',createdAt:new Date().toISOString()};
  Object.assign(base,e);if(r.con.length)base.confirmedWarnings=r.con;else delete base.confirmedWarnings;
  if(base.approx&&id){const old=S.events[id];base.approx=(old.approx||[]).filter(f=>old[f]===e[f])}
  const fi=$('#f-files');
  if(fi&&fi.files.length&&S.assets){base.files=base.files||[];for(const f of fi.files){try{const up=await S.assets.upload(f);base.files.push({id:up.id,name:f.name})}catch(err){toast('بارگذاری «'+f.name+'» انجام نشد.','bad')}}}
  for(const k of Object.keys(base))if(base[k]===undefined)delete base[k];
  const ok=await put('events/'+(id||uid('e')),base,id?'تغییرات ذخیره شد':'رویداد ثبت شد');
  if(btn)btn.disabled=false;
  if(ok){S.editing=false;S.form.draft=null;if(id){S.form.editId=null;location.hash='#history'}else{const keepV=e.vehicleId;S.form.draft={vehicleId:keepV};render(true)}}}

function repBounds(){const r=S.rep.range,t=todayISO();if(r==='ytd')return [startOfYear(),t];if(r==='12m'){const d=new Date();d.setFullYear(d.getFullYear()-1);return [iso(d),t]}if(r==='custom')return [S.rep.from||null,S.rep.to||null];return [null,null]}
const inR=(e,[a,b])=>(!a||e.date>=a)&&(!b||e.date<=b);
function monthBuckets(a,b){const out=[];const seen={};const d=parseD(a),end=parseD(b);let guard=0;while(d<=end&&guard<4000){const s=iso(d);const p=calParts(s);const k=p.y+'-'+String(p.m).padStart(2,'0');if(!seen[k]){seen[k]={key:k,first:s,label:fmtDate(s,{year:'2-digit',month:'short'})};out.push(seen[k])}d.setDate(d.getDate()+1);guard++}return out}
function repData(){
  const vs=V();if(!S.rep.veh||!vById(S.rep.veh))S.rep.veh=(activeV()[0]||vs[0]||{}).id;
  const vid=S.rep.veh,v=vById(vid),B=repBounds();const all=evs(vid).sort(sortEv);const inr=all.filter(e=>inR(e,B));
  const readings=all.filter(e=>e.km!=null);const rin=readings.filter(e=>inR(e,B));
  const prior=B[0]?readings.filter(e=>e.date<B[0]).pop():null;const startR=prior||rin[0],endR=rin[rin.length-1];
  const driven=(startR&&endR&&endR!==startR)?endR.km-startR.km:null;
  const {segs}=fuelSeries(vid);const sIn=segs.filter(s=>inR(s,B));const st=consStats(sIn);
  const fills=inr.filter(e=>e.type==='fuel');const cost=sumCur(inr);const fuelCost=sumCur(fills);
  return {v,vid,B,all,inr,driven,startR,endR,segs:sIn,st,fills,cost,fuelCost}}

  <p style="margin:0" class="small">داده‌ها فقط روی همین گوشی است. اگر اپ را از صفحه اصلی حذف کنید یا داده‌های Safari را پاک کنید، از بین می‌رود. هر چند وقت یک بار پشتیبان بگیرید و در Files یا iCloud Drive ذخیره کنید.</p>

async function onBackupFile(input){const f=input.files&&input.files[0];if(!f)return;
  let j;try{j=JSON.parse(await f.text())}catch(e){toast('این فایل قابل خواندن نیست.','bad');return}
  const data=j&&j.app==='car-monitoring'&&j.data?j.data:null;
  if(!data||typeof data!=='object'||!data.vehicles){toast('این فایل، پشتیبان پایش خودرو نیست.','bad');return}
  S.restore={name:f.name,data,exportedAt:j.exportedAt||null,counts:countsOf(data)};render(true)}
async function exportBackup(){
  const data=window.__localStore?window.__localStore.snapshot():{};

    if(p==='new'){const item=$('#new-item').value.trim();if(!item){toast('نام یادآوری را وارد کنید.','bad');return}

  if(d.vsave){const p=d.vsave;const isNew=p==='vnew';const id=isNew?uid('v'):p.slice(2);const v=isNew?{status:'active',slot:Math.min(8,V().length+1)}:clone(S.vehicles[id]);delete v.id;

document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const t=e.target.closest&&e.target.closest('[data-tip]');const tip=$('#tip');if(!t){tip.hidden=true;return}tip.textContent=t.getAttribute('data-tip');tip.hidden=false;const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+12,y=e.clientY-h-10;if(x+w>innerWidth-8)x=e.clientX-w-12;if(y<8)y=e.clientY+14;tip.style.left=x+'px';tip.style.top=y+'px'});

  tip.textContent=t.getAttribute('data-tip');tip.hidden=false;const w=tip.offsetWidth,h=tip.offsetHeight;let x=Math.min(Math.max(8,e.clientX-w/2),innerWidth-w-8),y=e.clientY-h-18;if(y<8)y=e.clientY+18;tip.style.left=x+'px';tip.style.top=y+'px';clearTimeout(tip._t);tip._t=setTimeout(()=>tip.hidden=true,3000)});

/* ---------- boot ---------- */
function setSync(on,msg){const s=$('#sync');s.className='sync '+(on?'on':'off');s.querySelector('span').textContent=msg}
function sub(col,key){
  S.db.collection(col).onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]=Object.assign({id:d.id},d.data())});S[key]=m;S.loaded[key]=true;setSync(true,'ذخیره روی همین گوشی');schedule()},
    err=>{setSync(false,'اتصال قطع شد');S.loaded[key]=true;schedule()})}
(async function boot(){
  route();
  if(!window.claude||!window.claude.use){setSync(false,'ذخیره‌سازی در دسترس نیست');$('#main').innerHTML='<div class="empty">این صفحه برای خواندن و ذخیره داده‌ها باید داخل Claude باز شود.</div>';return}
  const db=await claude.use('db');
  if(!db){setSync(false,'ذخیره‌سازی در دسترس نیست');$('#main').innerHTML='<div class="empty">دسترسی به داده‌ها در این نما ممکن نیست. صفحه را در حساب Claude خود باز کنید.</div>';return}
  S.db=db;
  claude.use('assets').then(a=>{S.assets=a;if(S.route==='add')render()});
  claude.use('downloads').then(d=>{S.downloads=d;schedule()});
  setTimeout(()=>{if(navigator.onLine)loadXLSX().catch(()=>{})},3000);
  window.addEventListener('local-save-failed',()=>toast('ذخیره روی گوشی انجام نشد؛ فضای ذخیره‌سازی پر است.','bad'));
  sub('vehicles','vehicles');sub('events','events');sub('rules','rules');sub('research','research');
  db.doc('meta/settings').onSnapshot(d=>{S.settings=d.exists?Object.assign({},d.data()):{currency:'TRY',calendar:'gregorian',docWarnDays:null,categories:['بیمه ترافیک','بیمه کاسکو','معاینه فنی','مالیات خودرو (MTV)','عوارض و HGS','جریمه','پارکینگ','کارواش','لوازم جانبی','سایر'],serviceKinds:['سرویس دوره‌ای','تعویض روغن و فیلتر','لاستیک','باتری','ترمز','لنت','تهویه/کولر','سایر']};S.loaded.settings=true;schedule()},()=>{S.loaded.settings=true;schedule()});
  render(true)})();
</script>
